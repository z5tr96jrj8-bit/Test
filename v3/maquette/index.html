<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RL Analysis v3 — maquette</title>
<link rel="stylesheet" href="../app/css/theme.css">
<style>
/* Maquette statique : montre le rendu visé, sans logique. */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 400 var(--fs-m)/1.3 var(--font); }
body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
svg { flex: none; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---- Menus ---- */
.menus { height: 30px; flex: none; display: flex; align-items: center; padding: 0 var(--s2); background: var(--chrome); border-bottom: 1px solid var(--line-hard); }
.menus button { height: 30px; padding: 0 10px; color: var(--text-2); font-size: var(--fs-m); }
.menus .r { margin-left: auto; color: var(--text-3); font-size: var(--fs-s); display: flex; gap: 14px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; margin-right: 6px; }

/* ---- Barre d'outils ---- */
.tools { height: 52px; flex: none; display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s3); background: var(--header); border-bottom: 1px solid var(--line-hard); }
.ib { width: var(--touch); height: var(--touch); display: grid; place-items: center; border-radius: var(--r2); color: var(--text); }
.ib:hover { background: var(--panel-2); }
.match { height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: var(--r2); background: var(--panel-2); }
.match b { font-weight: 700; } .match span { color: var(--text-2); }
.tabs { display: flex; padding: 3px; gap: 2px; background: var(--chrome); border-radius: var(--r2); margin-left: var(--s2); }
.tabs button { height: 38px; padding: 0 16px; border-radius: 4px; display: flex; align-items: center; gap: 8px; color: var(--text-2); font-weight: 600; }
.tabs button.on { background: var(--accent); color: var(--accent-ink); }
.tabs .n { min-width: 20px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--suggest); color: #160B33; font: 700 11px/18px var(--mono); }
.sp { flex: 1; }
.btn { height: 38px; padding: 0 14px; border-radius: var(--r2); background: var(--panel-2); display: flex; align-items: center; gap: 8px; font-weight: 600; }
.btn.pri { background: var(--accent); color: var(--accent-ink); }
.sep { width: 1px; height: 24px; background: var(--line); }

/* ---- Plan de travail ---- */
.work { flex: 1; min-height: 0; display: grid; gap: 1px; background: var(--line-hard); }
.pane { background: var(--panel); min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.ph { height: 36px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 12px; background: var(--header); border-bottom: 1px solid var(--line-hard); font-weight: 600; }
.ph small { color: var(--text-3); font-weight: 400; }
.pick { height: 28px; padding: 0 10px; border-radius: var(--r1); background: var(--panel-2); display: flex; align-items: center; gap: 6px; font-weight: 600; }
.seg { display: flex; background: var(--chrome); border-radius: var(--r1); padding: 2px; }
.seg button { height: 26px; padding: 0 12px; border-radius: 2px; color: var(--text-2); font-size: var(--fs-s); }
.seg button.on { background: var(--panel-2); color: var(--text); font-weight: 600; }

/* ---- Panel de codage ---- */
.grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); gap: 6px; padding: 10px; }
.grp { grid-column: 1 / -1; display: flex; align-items: flex-end; gap: 8px; padding: 6px 2px 0; color: var(--text-3); font-size: var(--fs-xs); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.grp::after { content: ""; flex: 1; height: 1px; background: var(--line); margin-bottom: 5px; }
.head { border-radius: var(--r1); display: grid; place-items: center; font-weight: 700; font-size: var(--fs-l); letter-spacing: .04em; text-transform: uppercase; color: #fff; }
.pb { position: relative; border-radius: var(--r1); color: #fff; font-weight: 700; font-size: 14px; letter-spacing: .01em; text-transform: uppercase; display: grid; place-items: center; text-align: center; padding: 0 22px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.16), inset 0 -2px 0 rgba(0,0,0,.18); }
.pb .k { position: absolute; left: 6px; top: 5px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 3px; background: rgba(0,0,0,.32); font: 700 10.5px/17px var(--mono); color: rgba(255,255,255,.9); }
.pb .c { position: absolute; right: 7px; bottom: 5px; font: 700 11px var(--mono); opacity: .8; }
.pb.sel { box-shadow: 0 0 0 2px var(--playhead); }
.pb.flag { grid-column: 1 / -1; color: #231A00; }
.res { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 10px 10px; }
.res button { height: 48px; border-radius: var(--r1); font-weight: 700; text-transform: uppercase; position: relative; }
.res .k { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font: 700 11px var(--mono); opacity: .7; }

/* ---- Lecteur ---- */
.video { flex: 1; min-height: 0; background: var(--chrome); display: grid; place-items: center; position: relative; }
.pitch { width: 100%; height: 100%; background: #2E6B34; position: relative; }
.pitch::before { content: ""; position: absolute; inset: 8% 3.5%; border: 3px solid rgba(255,255,255,.8); }
.pitch::after { content: ""; position: absolute; top: 8%; bottom: 8%; left: 50%; border-left: 3px solid rgba(255,255,255,.8); }
.vbadge { position: absolute; left: 10px; top: 10px; padding: 4px 8px; border-radius: var(--r1); background: rgba(0,0,0,.6); font-size: var(--fs-s); color: var(--text-2); }
.transport { flex: none; background: var(--header); border-top: 1px solid var(--line-hard); }
.seek { position: relative; height: 22px; margin: 0 14px; }
.seek .tr { position: absolute; left: 0; right: 0; top: 10px; height: 3px; background: #4A4D52; border-radius: 2px; }
.seek .pr { position: absolute; left: 0; top: 10px; height: 3px; background: var(--accent); }
.seek i { position: absolute; top: 4px; width: 2px; height: 14px; }
.seek .kn { position: absolute; top: 4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #fff; }
.tbar { height: 48px; display: flex; align-items: center; gap: 2px; padding: 0 8px; }
.tc { height: 30px; padding: 0 10px; display: flex; align-items: center; border-radius: var(--r1); background: var(--chrome); font: 500 14px var(--mono); margin-left: 8px; }
.tt { color: var(--text-3); font: 500 13px var(--mono); margin-left: 8px; }
.rate { display: flex; background: var(--chrome); border-radius: var(--r1); padding: 2px; }
.rate button { height: 32px; min-width: 40px; border-radius: 2px; font: 500 12px var(--mono); color: var(--text-2); }
.rate button.on { background: var(--panel-2); color: var(--text); }
.kbd { font: 600 10px var(--mono); color: var(--text-3); border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; margin-left: 4px; }

/* ---- Détails de la séquence ---- */
.seq { display: grid; grid-template-columns: 1.25fr .9fr 1fr; gap: 1px; background: var(--line-hard); flex: 1; min-height: 0; }
.seq > div { background: var(--panel); padding: 12px 14px; min-width: 0; }
.lab { color: var(--text-3); font-size: var(--fs-xs); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
.tagcard { display: flex; gap: 12px; }
.tagcard .bar { width: 5px; border-radius: 2px; background: var(--c-blue); }
.tagcard h3 { margin: 0 0 4px; font-size: var(--fs-xl); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 11px; background: var(--panel-2); font-size: var(--fs-s); color: var(--text-2); }
.chip.home::before, .chip.away::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--home); }
.chip.away::before { background: var(--away); }
.meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; }
.rchips { display: flex; gap: 6px; }
.rchips button { height: 36px; padding: 0 14px; border-radius: var(--r1); background: var(--panel-2); font-weight: 600; }
.rchips button.on { background: var(--ok); color: #06170D; }
.del { margin-top: 12px; height: 36px; padding: 0 14px; border-radius: var(--r1); background: var(--danger-bg); color: var(--danger-ink); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.zones { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(5, 1fr); height: 150px; border: 2px solid rgba(255,255,255,.55); background: #2B5A31; border-radius: 2px; }
.zones span { border-right: 1px dashed rgba(255,255,255,.25); border-bottom: 1px dashed rgba(255,255,255,.25); }
.zones span.on { background: rgba(255,255,255,.85); }
.note { height: 40px; width: 100%; border-radius: var(--r1); border: 1px solid var(--line); background: var(--chrome); color: var(--text-3); padding: 0 10px; display: flex; align-items: center; margin-bottom: 14px; }
.sugg { border: 1px dashed var(--suggest); border-radius: var(--r2); padding: 10px 12px; display: flex; gap: 10px; align-items: center; color: var(--text-2); }
.sugg b { color: var(--suggest); }
.recent { flex: none; height: 54px; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: var(--header); border-top: 1px solid var(--line-hard); overflow: hidden; }
.recent .it { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 0; border-radius: var(--r1); background: var(--panel-2); white-space: nowrap; font-size: var(--fs-s); }
.recent .it i { width: 4px; align-self: stretch; border-radius: 3px 0 0 3px; }

/* ---- Colonne de droite (Analyse) ---- */
.rtabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--header); border-bottom: 1px solid var(--line-hard); }
.rtabs button { height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text-3); font-size: var(--fs-xs); font-weight: 600; border-bottom: 2px solid transparent; }
.rtabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.filters { flex: none; display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.filters .chip { height: 30px; padding: 0 12px; border-radius: 15px; }
.filters .chip.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.codes { flex: 1; overflow: hidden; }
.cr { height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); }
.cr .ck { width: 16px; height: 16px; border-radius: 3px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); }
.cr .n { min-width: 26px; text-align: center; font: 700 11px/18px var(--mono); border-radius: 3px; background: var(--panel-2); }
.cr .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cr .sw { width: 4px; height: 18px; border-radius: 2px; }
.cr.sel { background: rgba(30,155,240,.16); box-shadow: inset 3px 0 0 var(--select); }
.cr.sel .n { background: var(--select); color: #fff; }

/* ---- Timeline ---- */
.tlt { flex: none; height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 8px; background: var(--header); border-bottom: 1px solid var(--line-hard); }
.tlt .sel { display: flex; gap: 10px; align-items: baseline; margin-left: 6px; }
.tlt .sel span { color: var(--text-3); }
.tlb { height: 32px; padding: 0 12px; border-radius: var(--r1); background: var(--panel-2); font-weight: 600; font-size: var(--fs-s); display: flex; align-items: center; gap: 6px; }
.tlbody { flex: 1; min-height: 0; display: grid; grid-template-columns: 236px 1fr; overflow: hidden; }
.tll { border-right: 1px solid var(--line-hard); background: var(--panel); }
.tlr { position: relative; overflow: hidden; }
.ruler { height: 28px; border-bottom: 1px solid var(--line-hard); background: var(--header); position: relative; }
.ruler span { position: absolute; bottom: 0; height: 100%; display: flex; align-items: flex-end; padding: 0 0 5px 5px; border-left: 1px solid var(--line); font: 500 11px var(--mono); color: var(--text-3); }
.lrow { height: var(--row); display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid var(--line-hard); font-size: var(--fs-s); }
.lrow .n { width: 24px; text-align: right; font: 700 11px var(--mono); color: var(--text-3); }
.lrow .nm { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .t { width: 8px; height: 8px; border-radius: 50%; }
.lrow.sel { background: rgba(30,155,240,.16); box-shadow: inset 3px 0 0 var(--select); }
.lrow.sug { color: var(--suggest); }
.trow { height: var(--row); position: relative; border-bottom: 1px solid var(--line-hard); }
.trow:nth-child(odd) { background: rgba(255,255,255,.025); }
.trow.sel { background: rgba(30,155,240,.12); }
.blk { position: absolute; top: 5px; height: 20px; border-radius: 2px; font-size: 11px; font-weight: 700; line-height: 20px; padding: 0 5px; white-space: nowrap; overflow: hidden; color: #fff; }
.blk.cur { box-shadow: 0 0 0 2px var(--playhead); z-index: 2; }
.blk.sg { background: rgba(167,139,250,.18) !important; border: 1px dashed var(--suggest); color: var(--suggest); line-height: 18px; }
.head-l { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--playhead); z-index: 3; }
.head-l::before { content: ""; position: absolute; top: 0; left: -6px; border: 7px solid transparent; border-top: 9px solid var(--playhead); }
</style>
</head>

<script>

function ic(n, s) { return '<svg width="' + (s || 18) + '" height="' + (s || 18) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + I[n] + '</svg>'; }

/* Données fictives : le panel par défaut et des tags répartis sur 10 minutes */

rows.push({ g: "", label: "À revoir", team: "", color: "var(--c-yellow)", key: "W", tags: [140, 401] });

document.getElementById("tools").innerHTML =

}

if (S === "code") {
  var work = document.getElementById("work"); work.style.gridTemplateColumns = "440px 1fr";
  var g = '<div class="head" style="background:var(--home)">Offensive</div><div class="head" style="background:var(--c-red)">Défensive</div>', last = null;
  rows.forEach(function (rw, i) {

  });
